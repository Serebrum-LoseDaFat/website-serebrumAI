<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Model III: Consolidate — Vygor provides the AI intelligence layer that connects fragmented health and wellness providers into a unified platform">
  <defs>
    <style>
      .sans { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
      .serif { font-family: 'Instrument Serif', Georgia, serif; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="520" fill="#fafafa" rx="24"/>
  <rect x="0.5" y="0.5" width="1199" height="519" rx="24" fill="none" stroke="rgba(0,0,0,0.08)"/>

  <!-- Header -->
  <text x="60" y="52" class="mono" fill="rgba(0,0,0,0.4)" font-size="10" letter-spacing="3">/ MODEL III · CONSOLIDATE</text>
  <text x="60" y="96" class="serif" fill="#0a0a0a" font-size="34" font-style="italic">Coordination cost drops to zero.</text>

  <!-- ── LEFT: FRAGMENTED PROVIDERS ── -->
  <text x="72" y="142" class="mono" fill="rgba(0,0,0,0.3)" font-size="9" letter-spacing="2.5">FRAGMENTED · NO SHARED INTELLIGENCE</text>
  <line x1="72" y1="150" x2="380" y2="150" stroke="rgba(0,0,0,0.07)" stroke-width="1"/>

  <!-- Provider nodes (scattered) -->
  <!-- Personal Trainer -->
  <circle cx="140" cy="210" r="38" fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.09)"/>
  <text x="140" y="206" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.35)" font-size="8" letter-spacing="1">PERSONAL</text>
  <text x="140" y="220" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.35)" font-size="8" letter-spacing="1">TRAINER</text>

  <!-- Nutritionist -->
  <circle cx="320" cy="192" r="38" fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.09)"/>
  <text x="320" y="196" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.35)" font-size="8" letter-spacing="1">NUTRITIONIST</text>

  <!-- Meal Planning App -->
  <circle cx="100" cy="318" r="38" fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.09)"/>
  <text x="100" y="312" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.35)" font-size="8" letter-spacing="1">MEAL</text>
  <text x="100" y="326" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.35)" font-size="8" letter-spacing="1">PLANNING</text>

  <!-- Macro Tracker -->
  <circle cx="310" cy="318" r="38" fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.09)"/>
  <text x="310" y="312" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.35)" font-size="8" letter-spacing="1">MACRO</text>
  <text x="310" y="326" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.35)" font-size="8" letter-spacing="1">TRACKER</text>

  <!-- Fitness Studio -->
  <circle cx="155" cy="428" r="38" fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.09)"/>
  <text x="155" y="422" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.35)" font-size="8" letter-spacing="1">FITNESS</text>
  <text x="155" y="436" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.35)" font-size="8" letter-spacing="1">STUDIO</text>

  <!-- Wellness Coach -->
  <circle cx="340" cy="428" r="38" fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.09)"/>
  <text x="340" y="422" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.35)" font-size="8" letter-spacing="1">WELLNESS</text>
  <text x="340" y="436" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.35)" font-size="8" letter-spacing="1">COACH</text>

  <!-- ── CENTER: VYGOR INTELLIGENCE LAYER ── -->
  <!-- Incoming lines (left nodes → center band) -->
  <line x1="178" y1="210" x2="478" y2="280" stroke="rgba(0,0,0,0.12)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="358" y1="195" x2="478" y2="272" stroke="rgba(0,0,0,0.12)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="138" y1="318" x2="478" y2="305" stroke="rgba(0,0,0,0.12)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="348" y1="318" x2="478" y2="312" stroke="rgba(0,0,0,0.12)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="193" y1="424" x2="478" y2="335" stroke="rgba(0,0,0,0.12)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="378" y1="424" x2="478" y2="340" stroke="rgba(0,0,0,0.12)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Intelligence band -->
  <rect x="478" y="258" width="244" height="100" rx="16" fill="rgba(0,0,0,0.04)" stroke="rgba(0,0,0,0.14)" stroke-width="1.5"/>
  <text x="600" y="294" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.45)" font-size="9" letter-spacing="2">INTELLIGENCE LAYER</text>
  <text x="600" y="316" text-anchor="middle" class="sans" fill="#0a0a0a" font-size="15" font-weight="500">Vygor</text>
  <text x="600" y="336" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.35)" font-size="8" letter-spacing="1.5">DIET · NUTRITION · MOVEMENT</text>

  <!-- Outgoing lines (center band → right nodes) -->
  <line x1="722" y1="280" x2="840" y2="210" stroke="rgba(0,0,0,0.25)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="722" y1="290" x2="840" y2="250" stroke="rgba(0,0,0,0.25)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="722" y1="305" x2="840" y2="310" stroke="rgba(0,0,0,0.25)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="722" y1="318" x2="840" y2="360" stroke="rgba(0,0,0,0.25)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="722" y1="330" x2="840" y2="398" stroke="rgba(0,0,0,0.25)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="722" y1="340" x2="840" y2="438" stroke="rgba(0,0,0,0.25)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ── RIGHT: UNIFIED PLATFORM ── -->
  <text x="848" y="142" class="mono" fill="rgba(0,0,0,0.55)" font-size="9" letter-spacing="2.5">UNIFIED · DATA COMPOUNDS ACROSS USERS</text>
  <line x1="848" y1="150" x2="1140" y2="150" stroke="rgba(0,0,0,0.07)" stroke-width="1"/>

  <!-- Connected platform nodes (organized) -->
  <rect x="840" y="168" width="280" height="52" rx="12" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.1)"/>
  <text x="980" y="190" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.4)" font-size="8" letter-spacing="1.5">MEAL PLAN · MACROS · EXERCISE</text>
  <text x="980" y="208" text-anchor="middle" class="sans" fill="#0a0a0a" font-size="13">AI-adaptive personal program</text>

  <rect x="840" y="236" width="280" height="52" rx="12" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.1)"/>
  <text x="980" y="258" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.4)" font-size="8" letter-spacing="1.5">PROVIDER NETWORK</text>
  <text x="980" y="276" text-anchor="middle" class="sans" fill="#0a0a0a" font-size="13">Trainers · Coaches · Studios</text>

  <rect x="840" y="304" width="280" height="52" rx="12" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.1)"/>
  <text x="980" y="326" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.4)" font-size="8" letter-spacing="1.5">BEHAVIORAL OUTCOMES</text>
  <text x="980" y="344" text-anchor="middle" class="sans" fill="#0a0a0a" font-size="13">Adherence · Progress · Response</text>

  <!-- Data moat -->
  <rect x="840" y="378" width="280" height="64" rx="12" fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.07)"/>
  <text x="980" y="400" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.3)" font-size="8" letter-spacing="1.5">LONGITUDINAL DATA MOAT</text>
  <text x="980" y="418" text-anchor="middle" class="sans" fill="rgba(0,0,0,0.45)" font-size="12">Macro-to-outcome correlations</text>
  <text x="980" y="434" text-anchor="middle" class="sans" fill="rgba(0,0,0,0.45)" font-size="12">Exercise response · Adherence curves</text>

  <!-- Caption -->
  <text x="60" y="494" class="sans" fill="rgba(0,0,0,0.45)" font-size="13">The coordination failure between providers and users was the moat. AI removes it — and replaces it with a data moat.</text>
</svg>
