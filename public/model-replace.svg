<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Model II: Replace — AlphaSigma runs the same function as a legacy fund on an entirely different AI-native architecture">
  <defs>
    <style>
      .sans { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
      .serif { font-family: 'Instrument Serif', Georgia, serif; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="520" fill="#fafafa" rx="24"/>
  <rect x="0.5" y="0.5" width="1199" height="519" rx="24" fill="none" stroke="rgba(0,0,0,0.08)"/>

  <!-- Header -->
  <text x="60" y="52" class="mono" fill="rgba(0,0,0,0.4)" font-size="10" letter-spacing="3">/ MODEL II · REPLACE</text>
  <text x="60" y="96" class="serif" fill="#0a0a0a" font-size="34" font-style="italic">Same job. Structurally different architecture.</text>

  <!-- ── INPUT NODE ── -->
  <circle cx="110" cy="310" r="42" fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.1)" stroke-width="1.5"/>
  <text x="110" y="303" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.5)" font-size="8" letter-spacing="1">MARKET</text>
  <text x="110" y="318" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.5)" font-size="8" letter-spacing="1">SIGNAL</text>

  <!-- Lines from input to both lanes -->
  <line x1="152" y1="285" x2="210" y2="222" stroke="rgba(0,0,0,0.15)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="152" y1="335" x2="210" y2="398" stroke="rgba(0,0,0,0.4)"  stroke-width="2"   stroke-linecap="round"/>

  <!-- ── TOP LANE: LEGACY ── -->
  <text x="220" y="148" class="mono" fill="rgba(0,0,0,0.28)" font-size="9" letter-spacing="2.5">LEGACY FUND · INCUMBENT ARCHITECTURE</text>

  <!-- Legacy boxes chain -->
  <rect x="210" y="190" width="116" height="48" rx="10" fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.08)"/>
  <text x="268" y="210" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.3)" font-size="8" letter-spacing="1">RESEARCH</text>
  <text x="268" y="228" text-anchor="middle" class="sans" fill="rgba(0,0,0,0.4)" font-size="12">Analyst team</text>

  <line x1="326" y1="214" x2="346" y2="214" stroke="rgba(0,0,0,0.18)" stroke-width="1.5"/>
  <polygon points="346,209 356,214 346,219" fill="rgba(0,0,0,0.18)"/>

  <rect x="356" y="190" width="116" height="48" rx="10" fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.08)"/>
  <text x="414" y="210" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.3)" font-size="8" letter-spacing="1">REVIEW</text>
  <text x="414" y="228" text-anchor="middle" class="sans" fill="rgba(0,0,0,0.4)" font-size="12">Human check</text>

  <line x1="472" y1="214" x2="492" y2="214" stroke="rgba(0,0,0,0.18)" stroke-width="1.5"/>
  <polygon points="492,209 502,214 492,219" fill="rgba(0,0,0,0.18)"/>

  <rect x="502" y="190" width="116" height="48" rx="10" fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.08)"/>
  <text x="560" y="210" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.3)" font-size="8" letter-spacing="1">COMMITTEE</text>
  <text x="560" y="228" text-anchor="middle" class="sans" fill="rgba(0,0,0,0.4)" font-size="12">Batch approval</text>

  <line x1="618" y1="214" x2="638" y2="214" stroke="rgba(0,0,0,0.18)" stroke-width="1.5"/>
  <polygon points="638,209 648,214 638,219" fill="rgba(0,0,0,0.18)"/>

  <rect x="648" y="190" width="116" height="48" rx="10" fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.08)"/>
  <text x="706" y="210" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.3)" font-size="8" letter-spacing="1">PORTFOLIO MGR</text>
  <text x="706" y="228" text-anchor="middle" class="sans" fill="rgba(0,0,0,0.4)" font-size="12">Single point of failure</text>

  <line x1="764" y1="214" x2="784" y2="214" stroke="rgba(0,0,0,0.18)" stroke-width="1.5"/>
  <polygon points="784,209 794,214 784,219" fill="rgba(0,0,0,0.18)"/>

  <rect x="794" y="190" width="116" height="48" rx="10" fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.08)"/>
  <text x="852" y="210" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.3)" font-size="8" letter-spacing="1">EXECUTE</text>
  <text x="852" y="228" text-anchor="middle" class="sans" fill="rgba(0,0,0,0.4)" font-size="12">Delayed trade</text>

  <line x1="910" y1="214" x2="980" y2="285" stroke="rgba(0,0,0,0.15)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ── STRUCTURAL GAP ── -->
  <line x1="555" y1="256" x2="555" y2="370" stroke="rgba(0,0,0,0.07)" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="555" y="318" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.25)" font-size="8" letter-spacing="1.5" writing-mode="tb">STRUCTURAL GAP</text>

  <!-- ── BOTTOM LANE: ALPHASIGMA ── -->
  <text x="220" y="365" class="mono" fill="rgba(0,0,0,0.6)" font-size="9" letter-spacing="2.5">ALPHASIGMA · AI-NATIVE ARCHITECTURE</text>

  <!-- AlphaSigma single clean box -->
  <rect x="310" y="382" width="560" height="60" rx="14" fill="rgba(0,0,0,0.04)" stroke="rgba(0,0,0,0.14)" stroke-width="1.5"/>
  <text x="590" y="406" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.5)" font-size="10" letter-spacing="2">CONTINUOUS AI PORTFOLIO MANAGEMENT</text>
  <text x="590" y="428" text-anchor="middle" class="sans" fill="#0a0a0a" font-size="13" font-weight="500">AlphaSigma — Transparent · Auditable · No batch cycles</text>

  <line x1="870" y1="412" x2="980" y2="340" stroke="rgba(0,0,0,0.4)" stroke-width="2" stroke-linecap="round"/>

  <!-- ── OUTPUT NODE ── -->
  <circle cx="1050" cy="310" r="42" fill="rgba(0,0,0,0.03)" stroke="rgba(0,0,0,0.14)" stroke-width="1.5"/>
  <text x="1050" y="303" text-anchor="middle" class="mono" fill="rgba(0,0,0,0.55)" font-size="9" letter-spacing="1">ALPHA</text>
  <text x="1050" y="320" text-anchor="middle" class="sans" fill="#0a0a0a" font-size="12" font-weight="500">Returns</text>

  <!-- Gap label -->
  <text x="60" y="476" class="sans" fill="rgba(0,0,0,0.45)" font-size="13">Incumbents optimizing the top path cannot close the structural gap with a challenger that started from scratch.</text>
</svg>
